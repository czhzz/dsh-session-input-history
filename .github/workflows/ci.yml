name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # `lib/` is committed so `dsh plugin add github:…` installs without a
      # build and without a pnpm build approval. That only holds while the
      # committed bundle tracks src/, so rebuild and fail if the tree moved.
      - name: Verify lib/ matches src/
        run: |
          npm run build
          git diff --exit-code -- lib/ || {
            echo "::error::lib/ is stale — run 'npm run build' and commit the result."
            exit 1
          }
